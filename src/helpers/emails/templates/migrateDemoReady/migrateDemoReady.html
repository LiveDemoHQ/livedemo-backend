<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Lato:400,900" rel="stylesheet">
    <title>Your LiveDemo is ready</title>
    <style type="text/css">
    body, .background_main, p, table, td, div {
        font-family: 'Lato', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    body {
        background: #f6f8fb;
        font-size: 17px;
        line-height: 24px;
        margin: 0;
        padding: 0;
    }
    </style>
</head>
<body>
<!-- Never add text the visitor entered (the source link, names): the landing form can send this to any address -->
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background: #f6f8fb;">
    <tr>
        <td align="center" style="padding: 40px 20px;">
            <table role="presentation" cellpadding="0" cellspacing="0" width="560" style="max-width: 560px; background: #ffffff; border-radius: 16px;">
                <tr>
                    <td style="padding: 36px 36px 0;">
                        <img src="https://livedemo.ai/images/logo.png" alt="LiveDemo" height="28" style="display: block; height: 28px;">
                    </td>
                </tr>
                <tr>
                    <td style="padding: 28px 36px 12px;">
                        <h1 style="margin: 0; font-size: 24px; line-height: 32px; color: #111827;">Your LiveDemo is ready</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 0 36px 28px; color: #4b5563; font-size: 16px; line-height: 26px;">
                        <p style="margin: 0;">We recreated your interactive demo in LiveDemo. Open it to play it, then click "Make it yours" to get your own editable copy.</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 0 36px 36px;">
                        <a href="{{demoUrl}}" style="display: inline-block; background: #1070ff; color: #ffffff; text-decoration: none; font-weight: 900; font-size: 16px; padding: 14px 26px; border-radius: 10px;">Open my demo</a>
                    </td>
                </tr>
            </table>
            <p style="margin: 16px 0 0; color: #9ca3af; font-size: 13px; line-height: 20px;">You got this email because this address asked livedemo.ai to recreate a demo.</p>
        </td>
    </tr>
</table>
</body>
</html>
